name: Build Manager

on:
  push:
    branches: [ "main", "master", "dev", "ci" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - 'manager/**'
  pull_request:
    branches: [ "main", "master", "dev" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - 'manager/**'
  workflow_dispatch:

# The manager is the only build product of this repository now: the kernel
# module, ksud and the bundled engines live outside it, so CI no longer
# assembles a flashable package.
permissions:
  contents: read

concurrency:
  group: manager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # versionCode is derived from the commit count, so the history has to
          # be complete here.
          fetch-depth: 0

      # apksign reads KEYSTORE_* from gradle.properties. Without the secret the
      # plugin keeps the debug signature, which is what a fork without signing
      # material gets, so the build never fails on a missing key.
      - name: Write signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE is not set, the APK will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > key.jks
          {
            echo "KEYSTORE_FILE='key.jks'"
            echo "KEYSTORE_PASSWORD='$KEYSTORE_PASSWORD'"
            echo "KEY_ALIAS='$KEY_ALIAS'"
            echo "KEY_PASSWORD='$KEY_PASSWORD'"
          } >> gradle.properties
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleRelease

      # The kernel module matches the manager by certificate size and hash, and
      # BakaSU-style dynamic manager registration asks for the same two numbers,
      # so publish them with every build.
      - name: Report signing certificate
        if: steps.key.outputs.configured == 'true'
        run: |
          keytool -exportcert -alias "${{ secrets.KEY_ALIAS }}" -keystore key.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -file release-cert.der
          SIZE=$(stat -c%s release-cert.der)
          HASH=$(sha256sum release-cert.der | awk '{print $1}')
          {
            echo "## Signing certificate"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| size (dec) | $SIZE |"
            printf '| size (hex) | 0x%04x |\n' "$SIZE"
            echo "| sha256 | \`$HASH\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "certificate size: $SIZE (0x$(printf '%04x' "$SIZE"))"
          echo "certificate sha256: $HASH"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: manager
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
